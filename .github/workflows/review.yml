name: Host verification
on: [push, pull_request]
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Guard the corrected sample
        run: python -m bootweave compare examples/robot-risky.xml examples/robot-revised.xml --protect motion-control
      - name: Guard the native configuration correction
        run: python -m bootweave compare native/configs/risky.xml native/configs/revised.xml --protect controller
      - name: Check recorded configuration bindings (not fresh target execution)
        run: |
          python -m bootweave evidence native/configs/risky.xml native/evidence/risky-automatic-evidence.json
          python -m bootweave evidence native/configs/revised.xml native/evidence/revised-automatic-evidence.json
